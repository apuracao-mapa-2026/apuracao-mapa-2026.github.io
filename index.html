.box{width:100%;max-width:380px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:24px 22px}
h1{font-size:1.3rem;margin:0 0 2px}

p{color:var(--muted);font-size:.85rem;margin:0 0 16px}

    <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" required>

    <input type="password" id="p" name="password" autocomplete="current-password" required>
    <label class="chk"><input type="checkbox" id="rem"> Manter conectado neste aparelho</label>
    <button type="submit" id="btn">Entrar</button>

  const base = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:fromB64(u.salt), iterations:VAULT.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(u.iv)}, k, fromB64(u.wk));
}
async function open(masterRaw){
  const mk = await crypto.subtle.importKey('raw', masterRaw, 'AES-GCM', false, ['decrypt']);
  const html = dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(VAULT.payload.iv)}, mk, fromB64(VAULT.payload.ct)));
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault(); const btn=document.getElementById('btn'), err=document.getElementById('err');
  btn.disabled=true; btn.textContent='Abrindo…'; err.textContent='';
  try{
    const raw = await unwrap(document.getElementById('u').value, document.getElementById('p').value);
    if(document.getElementById('rem').checked){ try{ localStorage.setItem('apuracao-key', toB64(raw)); }catch(_){} }
    await open(raw);
  }catch(ex){ err.textContent='Usuário ou senha incorretos.'; btn.disabled=false; btn.textContent='Entrar'; }
});
(async()=>{ try{ const s=localStorage.getItem('apuracao-key'); if(s) await open(fromB64(s)); }catch(_){ try{localStorage.removeItem('apuracao-key');}catch(e){} } })();
</script>
