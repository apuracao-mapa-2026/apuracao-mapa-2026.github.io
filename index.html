.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.box{width:100%;max-width:400px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.flag{width:6px;height:46px;border-radius:3px;background:linear-gradient(180deg,var(--br-g) 0 34%,var(--br-y) 34% 67%,var(--br-b) 67% 100%);flex:none}
h1{font-size:1.45rem;margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.1}
h1 small{display:block;font-size:.66rem;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
p{color:var(--muted);font-size:.86rem;margin:0 0 6px}
label{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px;font-weight:700}
input[type=text],input[type=password]{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.4);color:var(--fg)}
input:focus-visible{outline:2px solid var(--c22);outline-offset:1px}
.chk{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);margin-top:14px;text-transform:none;letter-spacing:0;font-weight:500}
button{width:100%;margin-top:16px;font:inherit;font-weight:700;padding:12px;border:none;border-radius:999px;background:var(--fg);color:#000;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--c13);font-size:.85rem;margin-top:10px;min-height:1.2em}
.foot{font-size:.7rem;color:var(--muted);margin-top:16px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <form class="box" id="f" autocomplete="on">
    <div class="brand"><div class="flag" aria-hidden="true"></div><h1><small>Eleições 2026 · Acesso restrito</small>Apuração do 2º Turno</h1></div>
    <p>Informe seu usuário e senha para abrir o painel.</p>
    <label for="u">Usuário</label>
    <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="p">Senha</label>
    <input type="password" id="p" name="password" autocomplete="current-password" required>
    <label class="chk"><input type="checkbox" id="rem"> Manter conectado neste aparelho</label>
    <button type="submit" id="btn">Entrar</button>
    <div class="err" id="err" aria-live="polite"></div>
    <div class="foot">O painel fica guardado de forma criptografada; a senha é a chave que o abre. Dados da apuração: TSE.</div>
  </form>

const enc = new TextEncoder(), dec = new TextDecoder();
const fromB64 = s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const toB64 = b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function unwrap(user, pwd){
  const u = VAULT.users[user.trim().toLowerCase()]; if(!u) throw new Error('user');
  const base = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:fromB64(u.salt), iterations:VAULT.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(u.iv)}, k, fromB64(u.wk));
}
async function open(masterRaw){
  const mk = await crypto.subtle.importKey('raw', masterRaw, 'AES-GCM', false, ['decrypt']);
  const html = dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(VAULT.payload.iv)}, mk, fromB64(VAULT.payload.ct)));
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault(); const btn=document.getElementById('btn'), err=document.getElementById('err');
  btn.disabled=true; btn.textContent='Abrindo…'; err.textContent='';
  try{
    const raw = await unwrap(document.getElementById('u').value, document.getElementById('p').value);
    if(document.getElementById('rem').checked){ try{ localStorage.setItem('apuracao-key', toB64(raw)); }catch(_){} }
    await open(raw);
  }catch(ex){ err.textContent='Usuário ou senha incorretos.'; btn.disabled=false; btn.textContent='Entrar'; }
});
// Abertura automática (acesso salvo): só depois que a página terminou de carregar,
// senão o navegador mistura a tela de login com o painel.
function autoOpen(){ setTimeout(async()=>{ try{ const s=localStorage.getItem('apuracao-key'); if(!s) return; document.getElementById('btn').disabled=true; document.getElementById('btn').textContent='Abrindo painel…'; await open(fromB64(s)); }catch(_){ try{localStorage.removeItem('apuracao-key');}catch(e){} const b=document.getElementById('btn'); if(b){ b.disabled=false; b.textContent='Entrar'; } } },50); }
if(document.readyState==='complete') autoOpen(); else window.addEventListener('load', autoOpen);
</script>
